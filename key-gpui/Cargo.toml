[package]
name = "key-gpui"
version = "0.1.0"
description = "Desktop app for a local or remote keepass database"
edition = "2021"

[dependencies]
key = { path = "../key", default-features = false }
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit"] }
gpui-component = "0.9.0"
# Lucide icon SVGs for the app and gpui-component controls.
gpui-kit-assets = "0.9.0"
# The S3 client in `key` runs on tokio.
tokio = { version = "1", features = ["rt", "net", "time"] }
anyhow = "1.0.86"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
home = "0.5.9"
