[tools]
rust = "1.99.1"
bun = "1.2"
node = "22"

[env]
_.file = '.env'
# "RUST_LOG" = "debug"

[tasks.cli]
dir = "key"
run = "cargo run --bin key"

[tasks."cli:build"]
dir = "key"
run = "cargo build --bin key --release"

[tasks."cli:install"]
depends = ["cli:build"]
run = "cp target/release/key $HOME/bin/key"

[tasks.app]
run = "cargo run -p key-gpui"

[tasks.raycast]
dir = "raycast/key"
run = "bun i && bun run dev"

[tasks."wasm:build"]
dir = "key"
run = "wasm-pack build --release"
